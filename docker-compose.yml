services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${STUDIO_PORT}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GAME_DATABASE_URL=${GAME_DATABASE_URL}
      - NEXTAUTH_URL=${STUDIO_NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${STUDIO_NEXTAUTH_SECRET}
    volumes:
      - studio_uploads:/app/data/map-uploads
      - studio_config:/app/config
    networks:
      - default
      - mmo_network
    restart: unless-stopped

  gm-panel:
    build:
      context: .
      dockerfile: Dockerfile.gm
    ports:
      - "${GM_PANEL_PORT}:3001"
    environment:
      - GAME_DATABASE_URL=${GAME_DATABASE_URL}
      - NEXTAUTH_URL=${GM_NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${GM_NEXTAUTH_SECRET}
    volumes:
      - gm_uploads:/app/data/map-uploads
      - gm_config:/app/config
    networks:
      - default
      - mmo_network
    restart: unless-stopped

volumes:
  studio_uploads:
  studio_config:
  gm_uploads:
  gm_config:

networks:
  mmo_network:
    external: true

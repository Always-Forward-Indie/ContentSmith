services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GAME_DATABASE_URL=${GAME_DATABASE_URL}
      - NEXTAUTH_URL=${STUDIO_NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${STUDIO_NEXTAUTH_SECRET:-change_me_in_production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gm-panel:
    build:
      context: .
      dockerfile: Dockerfile.gm
    ports:
      - "${GM_PANEL_PORT:-3001}:3001"
    environment:
      - GAME_DATABASE_URL=${GAME_DATABASE_URL}
      - NEXTAUTH_URL=${GM_NEXTAUTH_URL:-http://localhost:3001}
      - NEXTAUTH_SECRET=${GM_NEXTAUTH_SECRET:-change_me_in_production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
